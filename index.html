<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agro Sustentável</title>

    <style>

        body{
            margin: 0;
            padding: 0;
            text-align: center;
            font-family: Arial, sans-serif;

            /* Fundo degradê */
            background: linear-gradient(to bottom, #b9fbc0, #2d6a4f);

            color: white;
        }

        .container{
            padding-top: 40px;
        }

        h1{
            font-size: 55px;
            color: #ffffff;

            /* brilho no título */
            text-shadow:
                0 0 10px #90ee90,
                0 0 20px #90ee90,
                0 0 40px #00ff88;
        }

        p{
            font-size: 30px;
            margin-bottom: 30px;

            /* brilho no texto */
            text-shadow:
                0 0 5px white,
                0 0 15px #7fffd4;
        }

        img{
            width: 500px;
            border-radius: 20px;

            /* sombra/brilho na imagem */
            box-shadow:
                0 0 20px #90ee90,
                0 0 40px #00ff88,
                0 0 60px #00ff88;

            transition: 0.5s;
        }

        /* efeito quando passa o mouse */
        img:hover{
            transform: scale(1.05);
            box-shadow:
                0 0 30px #ffffff,
                0 0 60px #00ff88,
                0 0 90px #00ff88;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>🌱 Agro: um futuro sustentável 🌱</h1>

        <p>O agro alimenta o mundo e cuida da natureza ✨</p>

        <img src="agrinhoneymarhexa.png" alt="Imagem do agro">

    </div>

</body>
</html>
